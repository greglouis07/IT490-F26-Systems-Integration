<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-content">
            <nav class="site-nav">
                <a href="homePage.html">Search Cards</a>
                <a href="collection.html">My Collection</a>
                <a href="discussion.html">Discussion</a>
                <a href="index.html" id="logout-link">Log Out</a>
            </nav>
        </div>
    </header>

    <main class="card-details-container">

        <a href="homePage.html">← Back to Search</a>

        <h1 id="card-name">Card Details</h1>

        <div class="card-details-content">

            <img id="card-image" alt="Pokémon Card">

            <div class="card-information">

                <h2>Card Information</h2>

                <p><strong>Set:</strong> <span id="card-set">N/A</span></p>
                <p><strong>Number:</strong> <span id="card-number">N/A</span></p>
                <p><strong>Rarity:</strong> <span id="card-rarity">N/A</span></p>
                <p><strong>Printing Type:</strong> <span id="card-printing">N/A</span></p>

                <h2>Market Prices</h2>

                <p><strong>Market Price:</strong> <span id="market-price">N/A</span></p>
                <p><strong>Lowest Price:</strong> <span id="lowest-price">N/A</span></p>
                <p><strong>Median Price:</strong> <span id="median-price">N/A</span></p>

            </div>

        </div>

    </main>

    <script src="cardDetails.js"></script>

</body>
</html>
