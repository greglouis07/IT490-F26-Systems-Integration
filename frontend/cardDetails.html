<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Responsive Bootstrap Navigation -->
<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">

            <!-- Website Brand -->
            <a class="navbar-brand fw-bold" href="homePage.html">
                Pokemon Card Collection
            </a>

            <!-- Mobile Hamburger Button -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="homePage.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="collection.html">Portfolio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="marketPlace.html">Marketplace</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="discussion.html">Discussion Board</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html" id="logout-link">Log Out</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
</header>

    <main class="card-details-container">

        <a href="homePage.html" id="back-to-search">← Back to Search</a>

        <h1 id="card-name">Card Details</h1>

        <div class="card-details-content">

            <img id="card-image" alt="Pokémon Card">

            <div class="card-information">

                <h2>Card Information</h2>

                <p><strong>Set:</strong> <span id="card-set">N/A</span></p>
                <p><strong>Number:</strong> <span id="card-number">N/A</span></p>
                <p><strong>Rarity:</strong> <span id="card-rarity">N/A</span></p>
                <p><strong>Printing Type:</strong> <span id="card-printing">N/A</span></p>

                <h2>Market Prices</h2>

                <p><strong>Market Price:</strong> <span id="market-price">N/A</span></p>
                <p><strong>Lowest Price:</strong> <span id="lowest-price">N/A</span></p>
                <p><strong>Median Price:</strong> <span id="median-price">N/A</span></p>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cardDetails.js"></script>

</body>

</html>
